<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine Touren-Karte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root {
    --bg: #f5f3ef;
    --panel: #ffffff;
    --ink: #232323;
    --muted: #6b6b6b;
    --border: #e3ddd3;
    --accent: #2f6f4e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  #app { display: flex; height: 100vh; width: 100vw; position: relative; }
  #app.collapsed #sidebar { display: none; }
  .sidebar-close-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    color: var(--muted);
    padding: 4px 7px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .sidebar-close-btn:hover { background: #f1efe9; color: var(--ink); }
  #map-toggle-btn {
    display: none;
    position: absolute;
    top: 50%; left: 14px;
    transform: translateY(-50%);
    z-index: 1000;
    width: 40px; height: 40px;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 17px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }
  #app.collapsed #map-toggle-btn { display: flex; }
  @media (max-width: 640px) {
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100%;
      width: min(86vw, 320px);
      min-width: unset;
      z-index: 999;
      box-shadow: 2px 0 16px rgba(0,0,0,0.25);
    }
    #map { width: 100%; }
    .top-row { padding-left: 46px; }
    #header-sub { padding-left: 46px; }
  }
  #sidebar {
    width: 310px; min-width: 310px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 18px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #sidebar h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; }
  .top-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .top-row #app-heading { flex-grow: 1; }
  #lang-select {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  #sidebar .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  #import-box {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    margin-bottom: 12px;
    background: #faf9f6;
  }
  #import-box.dragover { border-color: var(--accent); background: #eef6f0; }
  #import-box p { margin: 0 0 8px 0; font-size: 12px; color: var(--muted); }
  .btn {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    color: var(--ink);
  }
  .btn:hover { background: #f1efe9; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #275f42; }
  .btn.danger { color: #c0392b; border-color: #e6b3ac; }
  .btn.danger:hover { background: #fbeaea; }
  #file-input { display: none; }

  .toolbar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .btn { flex: 1; font-size: 11.5px; padding: 6px 8px; }

  .master-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #faf9f6;
    font-size: 13px;
  }
  .master-row input[type=checkbox] { flex-shrink: 0; }
  .master-label { font-weight: 700; flex-grow: 1; }
  .cat-group {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .cat-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; cursor: pointer;
    background: #faf9f6; user-select: none;
  }
  .cat-header:hover { background: #f1efe9; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .cat-title { font-weight: 600; font-size: 13.5px; flex-grow: 1; }
  .cat-count { font-size: 11.5px; color: var(--muted); }
  .cat-stats { font-size: 11px; color: var(--muted); padding: 0 12px 8px 34px; }
  .track-list { display: none; padding: 2px 8px 8px 8px; }
  .cat-group.open .track-list { display: block; }
  .track-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
  }
  .track-item:hover { background: #f1efe9; }
  .track-item.dimmed { opacity: 0.4; }
  .track-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-item .left { display: flex; align-items: center; overflow: hidden; flex-grow: 1; }
  .track-item .meta { color: var(--muted); font-size: 11px; white-space: nowrap; margin-right: 4px; }
  .track-item input[type=checkbox] { margin-right: 6px; flex-shrink: 0; }
  .del-btn {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 0 2px; flex-shrink: 0;
  }
  .del-btn:hover { color: #c0392b; }
  #map { flex-grow: 1; }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .popup-title { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .popup-date { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }
  .popup-stats { font-size: 12px; }
  .toggle-arrow { transition: transform 0.15s; font-size: 10px; color: var(--muted); }
  .cat-group.open .toggle-arrow { transform: rotate(90deg); }
  #totals {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
  }
  #status-msg {
    font-size: 11.5px;
    margin-bottom: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    display: none;
  }
  #status-msg.show { display: block; }
  #status-msg.ok { background: #eaf5ed; color: #2f6f4e; }
  #status-msg.err { background: #fbeaea; color: #c0392b; }
  #load-status {
    font-size: 11.5px;
    margin-bottom: 10px;
    padding: 7px 9px;
    border-radius: 6px;
    display: none;
  }
  #load-status.show { display: block; }
  #load-status.loading { background: #f1efe9; color: var(--muted); }
  #load-status.ok { background: #eaf5ed; color: #2f6f4e; }
  #load-status.err { background: #fbeaea; color: #c0392b; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8d2c6; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="top-row">
      <h1 id="app-heading">Meine Touren</h1>
      <select id="lang-select">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>
      <button id="sidebar-close" class="sidebar-close-btn" title="Menü ausblenden">✕</button>
    </div>
    <div class="sub" id="header-sub"></div>
    <div id="load-status"></div>

    <!--
    Bearbeitungsfunktionen für die geteilte/öffentliche Version deaktiviert
    (Tracks hinzufügen, Sichern, Wiederherstellen, Alle löschen).
    Zum Wiederaktivieren diesen Block plus die zugehörigen Skript-Blöcke
    weiter unten (gleiche Markierung) wieder einkommentieren.

    <div id="import-box">
      <p id="drop-text">GPX-Dateien hierher ziehen oder</p>
      <button class="btn primary" id="add-btn" onclick="document.getElementById('file-input').click()">+ Tracks hinzufügen</button>
      <input id="file-input" type="file" accept=".gpx" multiple />
    </div>
    <div id="status-msg"></div>

    <div class="toolbar">
      <button class="btn" id="export-btn">Sichern (JSON)</button>
      <button class="btn" id="import-json-btn">Wiederherstellen</button>
      <button class="btn danger" id="delete-all-btn">Alle löschen</button>
      <input id="import-json-input" type="file" accept=".json" style="display:none" />
    </div>
    -->

    <div id="master-row" class="master-row">
      <input type="checkbox" id="master-checkbox" />
      <span class="master-label" id="master-label-text">Alle Tracks</span>
      <span class="cat-count" id="master-count"></span>
    </div>

    <div id="groups"></div>
    <div id="totals"></div>
  </div>
  <button id="map-toggle-btn" title="Menü anzeigen">☰</button>
  <div id="map"></div>
</div>

<script>
const STORAGE_KEY = 'tourenkarte_tracks_v1';
const COLOR_KEY = 'tourenkarte_colors_v1';

const BASE_COLORS = {
  'Rad': '#2ecc40',
  'Lauf': '#e74c3c',
  'LangLauf': '#3498db',
  'Skate': '#f1c40f',
  'Rodeln': '#9b59b6',
  'Kajak': '#16a085'
};
const EXTRA_PALETTE = ['#e67e22', '#1abc9c', '#e84393', '#7f8c8d', '#8d6e63', '#34495e', '#d35400'];

const LABELS = {
  'Rad': 'Fahrrad',
  'Lauf': 'Lauf',
  'LangLauf': 'Langlauf',
  'Skate': 'Skaten',
  'Rodeln': 'Rodeln',
  'Kajak': 'Kajak'
};

function loadColorMap() {
  try {
    const raw = localStorage.getItem(COLOR_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveColorMap(map) {
  localStorage.setItem(COLOR_KEY, JSON.stringify(map));
}
function colorFor(cat, colorMap) {
  if (BASE_COLORS[cat]) return BASE_COLORS[cat];
  if (colorMap[cat]) return colorMap[cat];
  const used = new Set(Object.values(colorMap).concat(Object.values(BASE_COLORS)));
  const free = EXTRA_PALETTE.find(c => !used.has(c)) || EXTRA_PALETTE[Object.keys(colorMap).length % EXTRA_PALETTE.length];
  colorMap[cat] = free;
  saveColorMap(colorMap);
  return free;
}
function labelFor(cat) {
  const s = T();
  return s.categories[cat] || LABELS[cat] || cat;
}

/* localStorage-Version deaktiviert - diese Seite lädt Tracks live aus
   einem GitHub-Repo-Ordner (siehe GITHUB_CONFIG weiter unten), nicht aus
   fest eingebauten Daten oder dem Browser-Speicher. */
function saveTracks(tracks) {
  // no-op: Tracks kommen live von GitHub, hier wird nichts gespeichert
}

// ==== GitHub-Konfiguration ====
// Trage hier deinen GitHub-Benutzernamen, den Repo-Namen, den Branch und
// den Ordner ein, in dem deine .gpx-Dateien liegen.
const GITHUB_CONFIG = {
  owner: 'tverdolik',   // z.B. 'serg123'
  repo: 'touren-karte',        // Name deines Repos
  branch: 'main',              // meist 'main' oder 'master'
  path: 'tracks'                // Ordner im Repo mit den .gpx-Dateien
};

async function fetchTracksFromGitHub() {
  const { owner, repo, branch, path } = GITHUB_CONFIG;
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
  const res = await fetch(apiUrl);
  if (!res.ok) {
    throw new Error('GitHub API Fehler (' + res.status + '). Prüfe owner/repo/branch/path in GITHUB_CONFIG.');
  }
  const items = await res.json();
  if (!Array.isArray(items)) {
    throw new Error('Unerwartete Antwort von GitHub - ist "path" wirklich ein Ordner?');
  }
  const gpxFiles = items.filter(it => it.type === 'file' && it.name.toLowerCase().endsWith('.gpx'));
  const results = [];
  let failed = 0;
  for (const file of gpxFiles) {
    try {
      const rawRes = await fetch(file.download_url);
      const text = await rawRes.text();
      const t = parseGPXFile(text, file.name);
      results.push(t);
    } catch (e) {
      console.error('Fehler beim Laden von', file.name, e);
      failed++;
    }
  }
  return { tracks: results, total: gpxFiles.length, failed: failed };
}

// ---- RDP simplification ----
function perpDist(pt, start, end) {
  if (start[0] === end[0] && start[1] === end[1]) {
    return Math.hypot(pt[0]-start[0], pt[1]-start[1]);
  }
  const [x1,y1] = start, [x2,y2] = end, [x0,y0] = pt;
  const num = Math.abs((y2-y1)*x0 - (x2-x1)*y0 + x2*y1 - y2*x1);
  const den = Math.hypot(y2-y1, x2-x1);
  return num/den;
}
function rdp(points, epsilon) {
  if (points.length < 3) return points;
  let dmax = 0, index = 0;
  for (let i = 1; i < points.length - 1; i++) {
    const d = perpDist(points[i], points[0], points[points.length-1]);
    if (d > dmax) { index = i; dmax = d; }
  }
  if (dmax > epsilon) {
    const left = rdp(points.slice(0, index+1), epsilon);
    const right = rdp(points.slice(index), epsilon);
    return left.slice(0, -1).concat(right);
  }
  return [points[0], points[points.length-1]];
}
function haversine(p1, p2) {
  const R = 6371000;
  const [lat1, lon1] = p1, [lat2, lon2] = p2;
  const phi1 = lat1 * Math.PI/180, phi2 = lat2 * Math.PI/180;
  const dphi = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(a)));
}

function parseGPXFile(text, filename) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('Ungültiges GPX: ' + filename);
  const trkpts = doc.getElementsByTagName('trkpt');
  const pts = [];
  const eles = [];
  for (let i = 0; i < trkpts.length; i++) {
    const tp = trkpts[i];
    const lat = parseFloat(tp.getAttribute('lat'));
    const lon = parseFloat(tp.getAttribute('lon'));
    if (isNaN(lat) || isNaN(lon)) continue;
    pts.push([lat, lon]);
    const eleEl = tp.getElementsByTagName('ele')[0];
    if (eleEl) eles.push(parseFloat(eleEl.textContent));
  }
  if (pts.length === 0) throw new Error('Keine Trackpunkte gefunden: ' + filename);

  let dist = 0;
  for (let i = 1; i < pts.length; i++) dist += haversine(pts[i-1], pts[i]);
  let gain = 0;
  for (let i = 1; i < eles.length; i++) {
    const d = eles[i] - eles[i-1];
    if (d > 0) gain += d;
  }

  const simplified = rdp(pts, 0.00003);

  // parse "Kategorie_YYYY-MM-DD_Ort.gpx"
  const base = filename.replace(/\.gpx$/i, '');
  const m = base.match(/^([^_]+)_(\d{4}-\d{2}-\d{2})_(.+)$/);
  let cat, date, place;
  if (m) {
    cat = m[1];
    date = m[2];
    place = m[3].replace(/_/g, ' ');
  } else {
    cat = 'Sonstiges';
    date = '';
    place = base.replace(/_/g, ' ');
  }

  return {
    file: filename,
    cat: cat,
    date: date,
    place: place,
    points: simplified.map(p => [Math.round(p[0]*1e5)/1e5, Math.round(p[1]*1e5)/1e5]),
    dist_km: Math.round(dist/100)/10,
    gain_m: Math.round(gain)
  };
}

let currentLang = localStorage.getItem(LANG_KEY) || 'de';
function T() { return I18N[currentLang]; }

function applyStaticText() {
  const s = T();
  document.title = s.pageTitle;
  document.documentElement.lang = currentLang;
  document.getElementById('app-heading').textContent = s.heading;
  document.getElementById('master-label-text').textContent = s.allTracksLabel;
  /* Bearbeitungsfunktionen deaktiviert - siehe Markierung oben im HTML
  document.getElementById('drop-text').textContent = s.dropText;
  document.getElementById('add-btn').textContent = s.addBtn;
  document.getElementById('export-btn').textContent = s.exportBtn;
  document.getElementById('import-json-btn').textContent = s.importBtn;
  document.getElementById('delete-all-btn').textContent = s.deleteAllBtn;
  */
  document.getElementById('lang-select').value = currentLang;
}


let tracks = [];
let colorMap = loadColorMap();
let visibleSet = new Set();

function setVisible(file, val) {
  if (val) visibleSet.add(file);
  else visibleSet.delete(file);
}
function setAllVisible(val) {
  tracks.forEach(t => setVisible(t.file, val));
}
function setGroupVisible(items, val) {
  items.forEach(t => setVisible(t.file, val));
}

const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let layersByFile = {};

function fmtDate(d) {
  if (!d) return "";
  const p = d.split("-");
  return p[2] + "." + p[1] + "." + p[0];
}

function clearLayers() {
  Object.values(layersByFile).forEach(l => map.removeLayer(l));
  layersByFile = {};
}

function addLayerForTrack(t) {
  const color = colorFor(t.cat, colorMap);
  const line = L.polyline(t.points, { color: color, weight: 3.5, opacity: 0.85 });
  const popupHtml =
    '<div class="popup-title">' + t.place + '</div>' +
    '<div class="popup-date">' + labelFor(t.cat) + (t.date ? ' · ' + fmtDate(t.date) : '') + '</div>' +
    '<div class="popup-stats">' + t.dist_km + ' km' + (t.gain_m ? ' · ' + t.gain_m + ' Hm' : '') + '</div>';
  line.bindPopup(popupHtml);
  line.on('mouseover', function(){ this.setStyle({ weight: 6 }); });
  line.on('mouseout', function(){ this.setStyle({ weight: 3.5 }); });
  if (visibleSet.has(t.file)) line.addTo(map);
  layersByFile[t.file] = line;
}

function renderAll(fitView) {
  clearLayers();
  tracks.forEach(addLayerForTrack);
  renderSidebar();
  if (fitView && tracks.length) {
    const bounds = L.latLngBounds([]);
    Object.values(layersByFile).forEach(l => bounds.extend(l.getBounds()));
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
  }
}

let lastByCat = {};
let groupCheckboxEls = {};
let masterCheckboxEl = null;

function updateHeaderStates() {
  const totalVisible = tracks.filter(t => visibleSet.has(t.file)).length;
  if (masterCheckboxEl) {
    masterCheckboxEl.checked = totalVisible === tracks.length && tracks.length > 0;
    masterCheckboxEl.indeterminate = totalVisible > 0 && totalVisible < tracks.length;
  }
  Object.keys(groupCheckboxEls).forEach(cat => {
    const items = lastByCat[cat] || [];
    const vis = items.filter(t => visibleSet.has(t.file)).length;
    const cb = groupCheckboxEls[cat];
    cb.checked = vis === items.length && items.length > 0;
    cb.indeterminate = vis > 0 && vis < items.length;
  });
}

function setLayerVisible(file, val) {
  const layer = layersByFile[file];
  if (!layer) return;
  if (val) layer.addTo(map);
  else map.removeLayer(layer);
}

function renderSidebar() {
  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = '';
  const byCat = {};
  tracks.forEach(t => {
    if (!byCat[t.cat]) byCat[t.cat] = [];
    byCat[t.cat].push(t);
  });
  lastByCat = byCat;
  groupCheckboxEls = {};

  const order = Object.keys(BASE_COLORS).filter(c => byCat[c]).concat(
    Object.keys(byCat).filter(c => !BASE_COLORS[c]).sort()
  );

  let totalKm = 0, totalCount = 0;

  order.forEach(cat => {
    const items = byCat[cat];
    items.sort((a,b) => (a.date||'').localeCompare(b.date||''));
    const color = colorFor(cat, colorMap);
    const catKm = items.reduce((s,t) => s+t.dist_km, 0);
    totalKm += catKm; totalCount += items.length;

    const group = document.createElement('div');
    group.className = 'cat-group';

    const header = document.createElement('div');
    header.className = 'cat-header';

    const groupCb = document.createElement('input');
    groupCb.type = 'checkbox';
    groupCb.addEventListener('click', (e) => e.stopPropagation());
    groupCb.addEventListener('change', () => {
      setGroupVisible(items, groupCb.checked);
      items.forEach(t => setLayerVisible(t.file, groupCb.checked));
      list.querySelectorAll('.track-item').forEach(el => {
        const cb = el.querySelector('input[type=checkbox]');
        cb.checked = groupCb.checked;
        el.classList.toggle('dimmed', !groupCb.checked);
      });
      updateHeaderStates();
    });
    groupCheckboxEls[cat] = groupCb;

    const arrow = document.createElement('span');
    arrow.className = 'toggle-arrow';
    arrow.textContent = '▶';

    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = color;

    const title = document.createElement('span');
    title.className = 'cat-title';
    title.textContent = labelFor(cat);

    const count = document.createElement('span');
    count.className = 'cat-count';
    count.textContent = items.length;

    header.appendChild(groupCb);
    header.appendChild(arrow);
    header.appendChild(swatch);
    header.appendChild(title);
    header.appendChild(count);
    header.addEventListener('click', (e) => {
      if (e.target === groupCb) return;
      group.classList.toggle('open');
    });
    group.appendChild(header);

    const statsEl = document.createElement('div');
    statsEl.className = 'cat-stats';
    statsEl.textContent = catKm.toFixed(1) + T().catKmSuffix;
    group.appendChild(statsEl);

    const list = document.createElement('div');
    list.className = 'track-list';

    items.forEach(t => {
      const item = document.createElement('div');
      item.className = 'track-item';
      if (!visibleSet.has(t.file)) item.classList.add('dimmed');

      const left = document.createElement('div');
      left.className = 'left';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = visibleSet.has(t.file);
      checkbox.addEventListener('change', (e) => {
        e.stopPropagation();
        setVisible(t.file, checkbox.checked);
        setLayerVisible(t.file, checkbox.checked);
        item.classList.toggle('dimmed', !checkbox.checked);
        updateHeaderStates();
      });
      left.appendChild(checkbox);

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = t.place;
      left.appendChild(nameSpan);

      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = (t.date ? fmtDate(t.date) + ' · ' : '') + t.dist_km + 'km';

      /* Einzel-Löschen für die geteilte Version deaktiviert - siehe Markierung oben im HTML
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.title = T().deleteTitle;
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirm(T().deleteConfirm(t.place))) return;
        tracks = tracks.filter(x => x.file !== t.file);
        visibleSet.delete(t.file);
        saveTracks(tracks);
        renderAll(false);
      });
      */
      const delBtn = null;

      item.appendChild(left);
      item.appendChild(meta);
      // item.appendChild(delBtn); // deaktiviert

      item.addEventListener('click', (e) => {
        if (e.target === checkbox || e.target === delBtn) return;
        map.fitBounds(layersByFile[t.file].getBounds(), { padding: [40,40] });
        layersByFile[t.file].openPopup(layersByFile[t.file].getBounds().getCenter());
      });

      list.appendChild(item);
    });

    group.appendChild(list);
    groupsEl.appendChild(group);
  });

  document.getElementById('header-sub').textContent = totalCount + T().toursSuffix;
  document.getElementById('totals').textContent = T().totalPrefix + totalKm.toFixed(0) + T().totalSuffix;
  document.getElementById('master-count').textContent = totalCount;
  updateHeaderStates();
}

masterCheckboxEl = document.getElementById('master-checkbox');
masterCheckboxEl.addEventListener('change', () => {
  setAllVisible(masterCheckboxEl.checked);
  tracks.forEach(t => setLayerVisible(t.file, masterCheckboxEl.checked));
  document.querySelectorAll('.track-item').forEach(el => {
    const cb = el.querySelector('input[type=checkbox]');
    cb.checked = masterCheckboxEl.checked;
    el.classList.toggle('dimmed', !masterCheckboxEl.checked);
  });
  Object.values(groupCheckboxEls).forEach(cb => {
    cb.checked = masterCheckboxEl.checked;
    cb.indeterminate = false;
  });
});

function showStatus(msg, ok) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'show ' + (ok ? 'ok' : 'err');
  setTimeout(() => { el.className = ''; }, 4000);
}

document.getElementById('lang-select').addEventListener('change', (e) => {
  currentLang = e.target.value;
  localStorage.setItem(LANG_KEY, currentLang);
  applyStaticText();
  renderAll(false);
});

const appEl = document.getElementById('app');
function setSidebarCollapsed(collapsed) {
  appEl.classList.toggle('collapsed', collapsed);
  setTimeout(() => map.invalidateSize(), 60);
}
document.getElementById('sidebar-close').addEventListener('click', () => setSidebarCollapsed(true));
document.getElementById('map-toggle-btn').addEventListener('click', () => setSidebarCollapsed(false));
if (window.matchMedia('(max-width: 640px)').matches) {
  setSidebarCollapsed(true);
}

function showLoadStatus(msg, kind) {
  const el = document.getElementById('load-status');
  el.textContent = msg;
  el.className = 'show ' + kind;
}

async function initFromGitHub() {
  showLoadStatus('Lade Tracks von GitHub …', 'loading');
  try {
    const result = await fetchTracksFromGitHub();
    tracks = result.tracks;
    visibleSet = new Set(tracks.map(t => t.file));
    if (result.total === 0) {
      showLoadStatus('Keine .gpx-Dateien im konfigurierten Ordner gefunden.', 'err');
    } else if (result.failed > 0) {
      showLoadStatus(tracks.length + ' von ' + result.total + ' Tracks geladen (' + result.failed + ' fehlgeschlagen).', 'err');
    } else {
      const el = document.getElementById('load-status');
      el.className = '';
    }
  } catch (err) {
    console.error(err);
    showLoadStatus(err.message || 'Tracks konnten nicht von GitHub geladen werden.', 'err');
  }
  applyStaticText();
  renderAll(true);
}

initFromGitHub();
